name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'http://localhost:4321' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ultracite)
        run: pnpm run check

      - name: Lint markdown
        run: pnpm run lint:md

      - name: Lint YAML
        run: pnpm run lint:yaml

      - name: Lint workflows
        run: pnpm run lint:actions

      - name: Spell check
        run: pnpm run lint:spell

      - name: Unit tests (Vitest)
        run: pnpm run test:unit

      - name: Type check (Astro & TS)
        run: pnpm exec astro check

      - name: Build
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests (Playwright)
        run: pnpm run test:e2e --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  secrets:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup toolchain (mise)
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Scan repository
        run: mise exec -- betterleaks dir .

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml .
          fail: true
